services:
  talebook:
    image: talebook/talebook  # 指定要使用的镜像
    container_name: talebook  # 设置容器名称为 talebook
    restart: unless-stopped  # 设定容器自动重启策略，always 表示无论如何都会重启
    ports:
      - "7485:80"  # 将宿主机的 6080 端口映射到容器的 80 端口
    volumes:
      - ./talebook:/data  # 将当前目录下的 talebook/data 目录挂载到容器的 /data 目录
